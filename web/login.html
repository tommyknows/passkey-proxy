<!doctype html>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>sign in</title>
<link rel="stylesheet" href="/auth/style.css" />
<main>
  <h1>Sign in</h1>
  <p class="sub">Use your passkey to continue.</p>
  <button id="login" hidden>Sign in with a passkey</button>
  <p id="out">Waiting for your passkey…</p>
</main>
<script type="module">
  const loginButton = document.getElementById("login");
  const status = document.getElementById("out");

  const showError = (error) => {
    status.textContent = error.message ?? error;
    status.className = "error";
  };

  const fetchLoginOptions = async () => {
    const response = await fetch("/auth/login/options", { method: "POST" });
    if (!response.ok) {
      throw new Error(await response.text());
    }

    return PublicKeyCredential.parseRequestOptionsFromJSON(
      await response.json(),
    );
  };

  const signIn = async () => {
    const credential = await navigator.credentials.get({
      publicKey: await fetchLoginOptions(),
    });

    const response = await fetch("/auth/login", {
      method: "POST",
      body: JSON.stringify(credential),
    });
    if (!response.ok) {
      throw new Error(await response.text());
    }

    // if rd query is set, use it to redirect back to that page after login. This
    // is how ingress-nginx's `auth-signin` works. Only follow it if it matches
    // our origin.
    const rd = new URLSearchParams(location.search).get("rd");
    if (rd && URL.parse(rd, location.href)?.origin === location.origin) {
      location.assign(rd);
    } else {
      location.reload();
    }
  };

  // Only one WebAuthn prompt may be open at a time.
  let pending = false;

  const attempt = async () => {
    if (pending) {
      return;
    }
    pending = true;
    loginButton.disabled = true;
    status.textContent = "Waiting for your passkey…";
    status.className = "";

    try {
      await signIn();
    } catch (error) {
      // If the prompt is blocked or dismissed, offer a retry button.
      showError(error);
      loginButton.hidden = false;
      loginButton.disabled = false;
    } finally {
      pending = false;
    }
  };

  loginButton.onclick = attempt;

  // WebAuthn prompts require a visible, focused document. Safari may preload
  // pages from history in the background and show them without firing
  // "focus", so also retry on visibility changes and offer the button.
  const ready = () =>
    document.visibilityState === "visible" && document.hasFocus();

  if (ready()) {
    attempt();
  } else {
    status.textContent = "Click to sign in with your passkey.";
    loginButton.hidden = false;

    const onReady = () => {
      if (!ready()) {
        return;
      }
      removeEventListener("focus", onReady);
      document.removeEventListener("visibilitychange", onReady);
      attempt();
    };
    addEventListener("focus", onReady);
    document.addEventListener("visibilitychange", onReady);
  }
</script>
